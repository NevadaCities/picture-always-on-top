<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image PiP</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='42' height='32' rx='6' fill='%239ca3af'/%3E%3Crect x='16' y='22' width='42' height='32' rx='6' fill='%231f2937'/%3E%3Ccircle cx='28' cy='32' r='3.5' fill='%23f5f6f7'/%3E%3Cpath d='M22 52 L31 40 L37 46 L43 40 L52 52 Z' fill='%23f5f6f7'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 460px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .title { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
        .subtitle { margin: 0 0 24px; font-size: 0.85rem; color: #6b7280; }

        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            margin-bottom: 20px;
            background: #fafafa;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            overflow: hidden;
        }
        .preview img { display: block; max-width: 100%; max-height: 300px; }
        .preview-placeholder { font-size: 0.85rem; color: #9ca3af; }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        .file-input { display: none; }

        .btn {
            /* 使用 Flex 布局确保 label 和 button 元素文字完美居中 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 0.9rem;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        
        .btn-secondary { background: #fff; color: #222; border-color: #d1d5db; }
        .btn-secondary:hover:not(:disabled) { background: #f3f4f6; }
        
        .btn-pip { background: #1f2937; color: #fff; }
        .btn-pip:hover:not(:disabled) { background: #111827; }

        .notice {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #92400e;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
        }
        .notice.is-visible { display: block; }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="title">Image PiP</h1>
        <p class="subtitle">Upload an image and pin it above all other windows.</p>

        <div class="preview" id="previewArea">
            <span class="preview-placeholder">No image selected</span>
        </div>

        <div class="controls">
            <label class="btn btn-secondary" for="fileInput">Choose Image</label>
            <input class="file-input" type="file" id="fileInput" accept="image/*">

            <button class="btn btn-secondary" id="pasteButton" type="button">
                Paste Image from Clipboard
            </button>

            <button class="btn btn-pip" id="pipButton" disabled>
                Pin in Picture-in-Picture
            </button>
        </div>

        <div class="notice" id="compatNotice">
            Your browser does not support the Document Picture-in-Picture API.
            Please use Chrome or Edge 116+, or Firefox 151+.
        </div>
    </main>

    <script>
        /* ==================== Element References ==================== */
        const fileInput    = document.getElementById('fileInput');
        const previewArea  = document.getElementById('previewArea');
        const pasteButton  = document.getElementById('pasteButton');
        const pipButton    = document.getElementById('pipButton');
        const compatNotice = document.getElementById('compatNotice');

        /* ==================== Capability Detection ==================== */
        const isPipSupported = 'documentPictureInPicture' in window;
        const isClipboardReadSupported = 
            !!(navigator.clipboard && typeof navigator.clipboard.read === 'function');

        /* ==================== State ==================== */
        let previewImageBlobUrl = null;
        let isOpeningPip = false;
        let isReadingClipboard = false;

        /* ==================== Initialization ==================== */
        if (!isPipSupported) {
            compatNotice.classList.add('is-visible');
        }

        if (!isClipboardReadSupported) {
            pasteButton.title =
                'Clipboard reading is not available in this browser. ' +
                'A secure (HTTPS) context and a modern browser are required.';
        }

        /* ==================== Utilities ==================== */
        function closeExistingPipWindow() {
            const existingWindow = window.documentPictureInPicture?.window;
            if (existingWindow) {
                existingWindow.close();
            }
        }

        function updatePipButtonState() {
            const canOpen = isPipSupported && !isOpeningPip && !!previewImageBlobUrl;
            pipButton.disabled = !canOpen;
        }

        function updatePasteButtonState() {
            pasteButton.disabled = !isClipboardReadSupported || isReadingClipboard;
        }

        function releasePreviewUrl() {
            if (previewImageBlobUrl) {
                URL.revokeObjectURL(previewImageBlobUrl);
                previewImageBlobUrl = null;
            }
        }

        function loadImageBlob(blob) {
            if (isOpeningPip) {
                alert('A Picture-in-Picture window is opening. Please try again in a moment.');
                return false;
            }

            closeExistingPipWindow();
            releasePreviewUrl();

            previewImageBlobUrl = URL.createObjectURL(blob);

            previewArea.innerHTML = '';
            const previewImage = document.createElement('img');
            previewImage.src = previewImageBlobUrl;
            previewImage.alt = 'Selected image';
            previewArea.appendChild(previewImage);

            updatePipButtonState();
            return true;
        }

        function handleClipboardError(error) {
            console.error('Failed to read from clipboard:', error);
            switch (error.name) {
                case 'NotAllowedError':
                    alert('Clipboard access was denied. Please allow clipboard permission for this site.');
                    break;
                case 'DataError':
                    alert('The clipboard is empty or its contents cannot be read.');
                    break;
                case 'NotFoundError':
                    alert('Clipboard reading is not available. Make sure the page is served over HTTPS or localhost.');
                    break;
                case 'SecurityError':
                    alert('Clipboard access is blocked for security reasons.');
                    break;
                default:
                    alert('Unable to read the clipboard: ' + (error.message || error.name));
            }
        }

        /* ==================== Event: Choose Image ==================== */
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            loadImageBlob(file);
            fileInput.value = '';
        });

        /* ==================== Event: Paste Image from Clipboard ==================== */
        pasteButton.addEventListener('click', async () => {
            if (!isClipboardReadSupported || isReadingClipboard) return;

            isReadingClipboard = true;
            updatePasteButtonState();

            try {
                const clipboardItems = await navigator.clipboard.read();
                if (clipboardItems.length === 0) {
                    alert('The clipboard is empty. Copy an image first, then try again.');
                    return;
                }

                let imageBlob = null;
                for (const item of clipboardItems) {
                    const imageType = item.types.find(type => type.startsWith('image/'));
                    if (imageType) {
                        imageBlob = await item.getType(imageType);
                        break;
                    }
                }

                if (!imageBlob) {
                    alert('The clipboard does not contain an image.');
                    return;
                }

                loadImageBlob(imageBlob);
            } catch (error) {
                handleClipboardError(error);
            } finally {
                isReadingClipboard = false;
                updatePasteButtonState();
            }
        });

        /* ==================== Event: Open PiP Window ==================== */
        pipButton.addEventListener('click', async () => {
            if (!isPipSupported || !previewImageBlobUrl || isOpeningPip) return;

            isOpeningPip = true;
            updatePipButtonState();

            const imageUrlForPip = previewImageBlobUrl;

            try {
                closeExistingPipWindow();
                const pipWindow = await documentPictureInPicture.requestWindow({
                    width: 400,
                    height: 300,
                });

                const style = pipWindow.document.createElement('style');
                style.textContent = `
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 100vw;
                        height: 100vh;
                        background: #111;
                        overflow: hidden;
                    }
                    img {
                        max-width: 100%;
                        max-height: 100%;
                        object-fit: contain;
                    }
                `;
                pipWindow.document.head.appendChild(style);

                const pipImage = pipWindow.document.createElement('img');
                pipImage.src = imageUrlForPip;
                pipImage.alt = 'Pinned image';
                pipWindow.document.body.appendChild(pipImage);
            } catch (error) {
                console.error('Failed to open the Picture-in-Picture window:', error);
                alert('Unable to open the Picture-in-Picture window. Check popup permissions or other open PiP windows.');
            } finally {
                isOpeningPip = false;
                updatePipButtonState();
            }
        });
    </script>
</body>
</html>
