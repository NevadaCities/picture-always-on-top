<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image PiP</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='42' height='32' rx='6' fill='%239ca3af'/%3E%3Crect x='16' y='22' width='42' height='32' rx='6' fill='%231f2937'/%3E%3Ccircle cx='28' cy='32' r='3.5' fill='%23f5f6f7'/%3E%3Cpath d='M22 52 L31 40 L37 46 L43 40 L52 52 Z' fill='%23f5f6f7'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 460px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .title { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
        .subtitle { margin: 0 0 24px; font-size: 0.85rem; color: #6b7280; }

        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            margin-bottom: 20px;
            background: #fafafa;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            overflow: hidden;
        }
        .preview img { display: block; max-width: 100%; max-height: 300px; }
        .preview-placeholder { font-size: 0.85rem; color: #9ca3af; }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        .file-input { display: none; }

        .btn {
            padding: 10px 16px;
            font-family: inherit;
            font-size: 0.9rem;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-upload { background: #fff; color: #222; border-color: #d1d5db; }
        .btn-upload:hover { background: #f3f4f6; }
        .btn-pip { background: #1f2937; color: #fff; }
        .btn-pip:hover:not(:disabled) { background: #111827; }

        .notice {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #92400e;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
        }
        .notice.is-visible { display: block; }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="title">Image PiP</h1>
        <p class="subtitle">Upload an image and pin it above all other windows.</p>

        <div class="preview" id="previewArea">
            <span class="preview-placeholder">No image selected</span>
        </div>

        <div class="controls">
            <label class="btn btn-upload" for="fileInput">Choose Image</label>
            <input class="file-input" type="file" id="fileInput" accept="image/*">

            <button class="btn btn-pip" id="pipButton" disabled>
                Pin in Picture-in-Picture
            </button>
        </div>

        <div class="notice" id="compatNotice">
            Your browser does not support the Document Picture-in-Picture API.
            Please use Chrome or Edge 116 or later.
        </div>
    </main>

    <script>
        /* ==================== Element References ==================== */
        const fileInput    = document.getElementById('fileInput');
        const previewArea  = document.getElementById('previewArea');
        const pipButton    = document.getElementById('pipButton');
        const compatNotice = document.getElementById('compatNotice');

        /* ==================== State ==================== */
        // Blob URL for the image currently shown in the preview
        let previewImageBlobUrl = null;

        // Mutex flag: prevents concurrent calls to requestWindow()
        let isOpeningPip = false;

        // Whether the browser supports Document PiP
        const isPipSupported = 'documentPictureInPicture' in window;

        /* ==================== Initialization ==================== */
        if (!isPipSupported) {
            compatNotice.classList.add('is-visible');
        }

        /* ==================== Utilities ==================== */

        // Close any existing PiP window in this tab (synchronous)
        function closeExistingPipWindow() {
            const existingWindow = window.documentPictureInPicture?.window;
            if (existingWindow) {
                existingWindow.close();
            }
        }

        // Centralize button state so it stays consistent across handlers
        function updatePipButtonState() {
            const canOpen = isPipSupported && !isOpeningPip && !!previewImageBlobUrl;
            pipButton.disabled = !canOpen;
        }

        // Release the preview Blob URL to avoid memory leaks
        function releasePreviewUrl() {
            if (previewImageBlobUrl) {
                URL.revokeObjectURL(previewImageBlobUrl);
                previewImageBlobUrl = null;
            }
        }

        /* ==================== Event: Image Selection ==================== */
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Reject switching while PiP is opening, to avoid URL lifetime races
            if (isOpeningPip) {
                alert('A Picture-in-Picture window is opening. Please try again in a moment.');
                return;
            }

            // Close any open PiP window before revoking the URL it may reference
            closeExistingPipWindow();
            releasePreviewUrl();

            previewImageBlobUrl = URL.createObjectURL(file);

            previewArea.innerHTML = '';
            const previewImage = document.createElement('img');
            previewImage.src = previewImageBlobUrl;
            previewImage.alt = 'Selected image';
            previewArea.appendChild(previewImage);

            updatePipButtonState();
        });

        /* ==================== Event: Open PiP Window ==================== */
        pipButton.addEventListener('click', async () => {
            // Triple guard: unsupported / no image / already opening
            if (!isPipSupported || !previewImageBlobUrl || isOpeningPip) {
                return;
            }

            // Lock and disable the button synchronously to block re-entry
            isOpeningPip = true;
            updatePipButtonState();

            // Snapshot the URL so it cannot be overwritten during await
            const imageUrlForPip = previewImageBlobUrl;

            try {
                // Close the old window first (synchronous)
                closeExistingPipWindow();

                // Request a new window; isOpeningPip blocks other entry points
                const pipWindow = await documentPictureInPicture.requestWindow({
                    width: 400,
                    height: 300,
                });

                const style = pipWindow.document.createElement('style');
                style.textContent = `
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 100vw;
                        height: 100vh;
                        background: #111;
                        overflow: hidden;
                    }
                    img {
                        max-width: 100%;
                        max-height: 100%;
                        object-fit: contain;
                    }
                `;
                pipWindow.document.head.appendChild(style);

                const pipImage = pipWindow.document.createElement('img');
                pipImage.src = imageUrlForPip;
                pipImage.alt = 'Pinned image';
                pipWindow.document.body.appendChild(pipImage);
            } catch (error) {
                console.error('Failed to open the Picture-in-Picture window:', error);
                alert(
                    'Unable to open the Picture-in-Picture window. Possible reasons:\n' +
                    '1. The browser is blocking pop-up windows;\n' +
                    '2. Another tab already has a PiP window open (Chrome/Edge allow only one globally).'
                );
            } finally {
                isOpeningPip = false;
                updatePipButtonState();
            }
        });
    </script>
</body>
</html>
